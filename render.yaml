services:
  - type: web
    name: telegram-assistant
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app.main:app
    healthCheckPath: /healthz
    envVars:
      # sync false means Render asks you for the value instead of storing it here.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CALENDAR_ID
        sync: false
      - key: SERVICE_ACCOUNT_JSON
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TASKS_SECRET
        sync: false
      - key: TELEGRAM_CONTACTS
        sync: false
      - key: EXTRA_CALENDAR_IDS
        sync: false
      - key: EXPENSES_SPREADSHEET_ID
        sync: false
      - key: DEFAULT_WEATHER_LOCATION
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: THINKING_LEVEL
        value: low
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: EXPENSES_SHEET_NAME
        value: Expenses
      - key: MORNING_HOUR
        value: "7"
      - key: MAX_VOICE_SECONDS
        value: "120"
      - key: TIMEZONE
        value: Australia/Perth
      - key: PYTHON_VERSION
        value: "3.12.8"
